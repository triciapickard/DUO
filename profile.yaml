# Who Duo is working for. Edit freely; this is the only input Phase 0 needs.
# Keep sensitive details (addresses, card numbers) OUT of this file. The model sees it.

name: Tricia
location:
  city: "CHANGE ME, e.g. Sydney"
  country: "CHANGE ME, e.g. Australia"
  timezone: "CHANGE ME, e.g. Australia/Sydney"

interests:
  - kind: sports_team
    sport: cricket
    team: "CHANGE ME, e.g. Australia men's national team"
    priority: high
    notes: "International matches only. Tests and ODIs preferred over T20s."

budgets:
  event_ticket:
    max_per_ticket: 120
    currency: AUD

preferences:
  seating: ["shaded", "aisle", "not behind the sightscreen"]
  companions: 1          # how many extra tickets to propose (so 2 total)
  travel_radius_km: 50   # how far from home is reasonable for an event

rules:
  - "Never spend money without asking."
  - "Only propose events in the next 6 weeks."
  - "Prefer weekends. Weekday evenings are fine; weekday daytime is not."
  - "Do not propose anything you cannot back with a URL you actually fetched."
